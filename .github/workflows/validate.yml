name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run repository validation
        run: |
          chmod +x scripts/*.sh tests/*.sh
          bash scripts/validate-all.sh

  # The Python suite shells out to helpers and hashes file bytes, so it is exposed
  # to three things a Linux-only matrix cannot see. All three were live on main
  # until 2026-08-19 and every one of them was invisible here:
  #   - "python3" is a Store stub on Windows that runs nothing and prints an ad
  #   - core.autocrlf=true (system default) rewrites the bytes under a digest check
  #   - git identity paths come back C:/... but resolve to C:\...
  # validate-all.sh stays Linux-only -- it is a bash pipeline with find/chmod in it.
  # This job runs just the part that has a real chance of breaking per-platform.
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run the Python test suite on Windows
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # Nothing exercised the oldest supported Python: the Linux job uses whatever
  # the runner ships and the Windows job pins 3.13. A floor no job executes is a
  # claim, not a guarantee -- and this one was wrong. Reading the source
  # suggested 3.9 (str.removeprefix), but kernel.py calls
  # Path.write_text(newline=...), which is 3.10+. The first run of this job
  # found it; 11 tests errored on 3.9. Do not lower this pin without moving
  # those four call sites off the newline kwarg.
  tests-minimum-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run repository validation on the minimum supported Python
        run: |
          chmod +x scripts/*.sh tests/*.sh
          bash scripts/validate-all.sh
